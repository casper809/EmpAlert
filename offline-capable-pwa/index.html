<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Offline-Capable PWA</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <main class="container">
    <header>
      <h1>Offline-Capable PWA</h1>
      <div id="status-badge" class="badge online">Online</div>
    </header>

    <section class="card">
      <h2>PWA Status</h2>
      <p id="sw-status">Checking Service Worker status...</p>
      <button id="check-update-btn">Check for Updates</button>
    </section>

    <section class="card">
      <h2>About This Setup</h2>
      <p>This application includes a complete Progressive Web App setup configured for offline availability and fast caching strategy.</p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
